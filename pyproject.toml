[project]
name = "qdrant-rag-server"
version = "0.1.0"
description = "Async multi-tenant RAG service with Qdrant and OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "qdrant-client>=1.7",
    "sentence-transformers>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
ner = [
    "spacy>=3.7",
]
sparse = [
    "fastembed>=0.3",
]
documents-lite = [
    "PyMuPDF>=1.24",
    "pypdf>=4",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "trafilatura>=1.8",
]
documents-docling = [
    "docling>=2",
]

[tool.setuptools.packages.find]
include = [
    "configs*",
    "ingestion_service*",
    "manager_service*",
    "memory_service*",
    "project_service*",
    "retrieval_service*",
    "server*",
    "shared*",
    "workflow_log_service*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
