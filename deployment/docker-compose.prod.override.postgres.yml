# Postgres cutover override: run the RAG memory path on the opt-in Postgres
# backend (RAG-owned, rag-internal) alongside the existing shared stack.
#
# - Enables the RAG-owned postgres service (base compose defines it under the
#   "postgres" profile).
# - Adopts the existing global rag-memory-test network (external:true) and uses
#   the already-running local broker / SA redis (replicas: 0 for redpanda/redis).
# - Points the memory-path services at postgres via their *_DB_URL env vars.
#   SQLite stores stay untouched unless a *_DB_URL is set here.
#
# Bring up:
#   cd deployment
#   POSTGRES_PASSWORD=<secret> \
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.override.postgres.yml \
#     --profile postgres up -d postgres memory retrieval-index retrieval
services:
  memory:
    depends_on: !reset []
    environment:
      MEMORY_DB_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
  retrieval:
    depends_on: !reset []
    environment:
      RAG_RESPONSE_CACHE_DB_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
      RETRIEVAL_PLACEMENT_DB_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
  retrieval-index:
    depends_on: !reset []
    environment:
      RETRIEVAL_PLACEMENT_DB_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
  redpanda:
    deploy:
      replicas: 0
  redis:
    deploy:
      replicas: 0
networks:
  rag-memory-test:
    external: true
