            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/rag
        ports:
        - containerPort: 9012
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9012
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9012
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        startupProbe:
          tcpSocket:
            port: 9012
          periodSeconds: 5
          failureThreshold: 120
        command:
        - python
        - -m
        - memory_service.worker
      imagePullSecrets:
      - name: gitlab-registry-qdrant-rag-server
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rag-data
---
apiVersion: v1
kind: Service
metadata:
  name: rag-memory
  namespace: agents-dev
  labels:
    app.kubernetes.io/part-of: agent-platform-dev
spec:
  selector:
    app: rag-memory
  ports:
  - port: 9012
    targetPort: 9012
