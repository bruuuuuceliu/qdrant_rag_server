apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-manager
  namespace: agents-dev
  labels:
    app.kubernetes.io/part-of: agent-platform-dev
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag-manager
  template:
    metadata:
      labels:
        app: rag-manager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rag
        image: bruceserver.tail3d8162.ts.net:5050/bruce/qdrant_rag_server:dev
        imagePullPolicy: Always
        env:
        - name: RAG_CONFIG_PROFILE
          value: local
        - name: RAG_OPS_ENABLED
          value: 'true'
        - name: BROKER_BOOTSTRAP_SERVERS
          value: redpanda.agents-dev.svc.cluster.local:9092
        - name: RAG_QDRANT_HOST
          value: qdrant
        - name: RAG_QDRANT_PORT
          value: '6333'
        - name: RAG_QDRANT_URL
          value: http://qdrant:6333
        - name: RETRIEVAL_PLACEMENT_ENABLED
          value: 'true'
        - name: RETRIEVAL_PLACEMENT_SHARD_ID
          value: retrieval-primary
        - name: RETRIEVAL_PLACEMENT_CLUSTER_ID
          value: retrieval-cluster
        - name: RAG_OBJECT_STORAGE_PROVIDER
          value: filesystem
        - name: RAG_OBJECT_STORAGE_BASE_PATH
          value: /var/lib/rag/raw_storage
        - name: RAG_GENERATION_ENABLED
          value: 'false'
        - name: RAG_OPS_PORT
          value: '9001'
        - name: RAG_GRPC_PORT
          value: '50051'
        - name: BROKER_TOPIC_PREFIX
          value: ''
        - name: RAG_OTEL_ENDPOINT
          value: ''
        - name: HTTP_PROXY
          value: http://10.0.0.1:7890
        - name: HTTPS_PROXY
          value: http://10.0.0.1:7890
        - name: NO_PROXY
          value: localhost,127.0.0.1,postgres,qdrant,redis,.svc,.cluster.local
        - name: HF_HOME
          value: /var/lib/rag/models
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /var/lib/rag/models
        - name: RAG_EMBEDDING_MODEL_CACHE_DIR
          value: /var/lib/rag/models
        - name: REDIS_TASK_STATUS_URL
          value: redis://redis:6379/0
        - name: RAG_POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: agents-runtime
              key: DB_RAG
        - name: SERVICE_AUTH_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: agents-runtime
              key: SERVICE_AUTH_SIGNING_KEY
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/rag
        ports:
        - containerPort: 9001
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9001
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        startupProbe:
          tcpSocket:
            port: 9001
          periodSeconds: 5
          failureThreshold: 120
        command:
        - python
        - -m
        - manager_service.worker
      imagePullSecrets:
      - name: gitlab-registry-qdrant-rag-server
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rag-data
---
apiVersion: v1
kind: Service
metadata:
